<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Platinum Tracker — GTA VI Trophy Guide</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="vice-shell">
  <header id="completion-hud">
    <h1><span class="vc-badge">VC</span>Vice City Platinum Tracker</h1>
    <p class="subtitle">55 Official PS5 Trophies &bull; Offline Walkthroughs &amp; Roadmap &bull; Zero Network</p>
    <div class="hud-stats">
      <div class="hud-box"><div class="label">Overall</div><div class="value" id="hud-overall">0 / 55 &bull; 0%</div></div>
      <div class="hud-box"><div class="label">Tiers</div><div class="value" id="hud-tiers">Platinum 0/1 &bull; Gold 0/2 &bull; Silver 0/6 &bull; Bronze 0/46</div></div>
      <div class="hud-box"><div class="label">Roadmap</div><div class="phase-chips" id="hud-phases"></div></div>
    </div>
  </header>

  <nav id="workspace-nav" aria-label="Views">
    <button type="button" data-view="catalog" aria-selected="true">Catalog &amp; Walkthroughs</button>
    <button type="button" data-view="blueprint" aria-selected="false">Platinum Blueprint</button>
    <button type="button" data-view="missable" aria-selected="false">Missable Alert &amp; Saves</button>
    <button type="button" data-view="reference" aria-selected="false">Reference Index</button>
  </nav>

  <div id="command-controls">
    <input id="query-box" type="search" placeholder="Search trophies&hellip;" autocomplete="off">
    <div id="category-pills" role="group" aria-label="Category">
      <button type="button" data-category="all" aria-pressed="true">All (55)</button>
      <button type="button" data-category="story" aria-pressed="false">Story</button>
      <button type="button" data-category="missable" aria-pressed="false">Missable (1)</button>
      <button type="button" data-category="collectibles" aria-pressed="false">Collectibles</button>
      <button type="button" data-category="activities" aria-pressed="false">Activities</button>
      <button type="button" data-category="online" aria-pressed="false">Online (0)</button>
    </div>
    <select id="tier-select">
      <option value="all">All tiers</option>
      <option value="platinum">Platinum</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="bronze">Bronze</option>
    </select>
    <label class="toggle"><input id="spoiler-shield" type="checkbox"> Hide spoilers</label>
    <label class="toggle"><input id="unlocked-filter" type="checkbox"> Unlocked only</label>
    <span class="spacer"></span>
    <button id="btn-export" type="button" class="btn">Export</button>
    <button id="btn-import" type="button" class="btn">Import</button>
    <button id="btn-reset" type="button" class="btn">Reset</button>
    <input id="import-file" type="file" accept="application/json" hidden>
  </div>

  <main>
    <section id="view-catalog" aria-label="Catalog and walkthroughs">
      <div class="split">
        <div class="panel" id="trophy-catalog" tabindex="0" aria-label="Trophy catalog"></div>
        <div class="panel" id="guide-inspector" aria-label="Guide inspector"></div>
      </div>
    </section>
    <section id="view-blueprint" class="hidden-view" aria-label="Platinum blueprint">
      <div class="panel" id="blueprint-panel"></div>
    </section>
    <section id="view-missable" class="hidden-view" aria-label="Missable alert and saves">
      <div class="panel" id="missable-panel"></div>
    </section>
    <section id="view-reference" class="hidden-view" aria-label="Reference index">
      <div class="panel" id="reference-panel"></div>
    </section>
  </main>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
